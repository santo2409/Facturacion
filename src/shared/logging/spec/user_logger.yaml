version: "1.0.0"
kind: LoggerContract
metadata:
  owner: infrastructure
  audience: end_user
  immutable_at_runtime: true
  scope: presentation_layer_only
config:
  version: 1
  disable_existing_loggers: false
  formatters:
    user_console:
      format: "%(message)s"
  handlers:
    console:
      "()": src.shared.console.user_console.build_user_console_handler
      level: INFO
      formatter: user_console
  loggers:
    user_logger:
      level: INFO
      handlers: [console]
      propagate: false
validation:
  allowed_levels: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
  max_log_size_mb: 10
  required_handlers: [console]
  forbid_root_mutation: true
